# Dependency PRs are disabled: plugin changes are tested and pushed directly to master.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
